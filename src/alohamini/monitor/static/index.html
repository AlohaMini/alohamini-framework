<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./monitor.css" />
    <link rel="stylesheet" href="./layout.css" />
    <title>AlohaMini · Training Monitor</title>
  </head>
  <body>
    <svg aria-hidden="true" class="symbols" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-activity" viewBox="0 0 24 24"><path d="M2 13h5l3-8 4 14 3-9 2 3h3" /></symbol>
      <symbol id="icon-expand" viewBox="0 0 24 24">
        <path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5" />
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="2" />
        <rect x="14" y="3" width="7" height="7" rx="2" />
        <rect x="3" y="14" width="7" height="7" rx="2" />
        <rect x="14" y="14" width="7" height="7" rx="2" />
      </symbol>
      <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 4v15h17M7 13l4-4 4 3 5-7" /></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10" cy="10" r="6" />
        <path d="m15 15 5 5" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-import" viewBox="0 0 24 24">
        <path d="M12 3v11m-4-4 4 4 4-4M4 15v5h16v-5" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" /></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="m7 4 12 8-12 8V4Z" /></symbol>
      <symbol id="icon-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <ellipse cx="12" cy="12" rx="4" ry="9" />
        <path d="M3 12h18" />
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v12H3V7Z" /></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 6v6l4 2" />
      </symbol>
      <symbol id="icon-panel" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M9 4v16" />
      </symbol>
    </svg>
    <header class="topbar">
      <button class="icon-button" id="menu" aria-controls="sidebar">
        <svg class="icon"><use href="#icon-panel" /></svg>
      </button>
      <nav class="tabs" data-label="views">
        <button data-tab="metrics" data-t="metrics"></button>
        <button data-tab="diagnostics" data-t="diagnostics"></button>
        <button data-tab="evaluation" data-t="evaluation"></button>
        <button data-tab="config" data-label="config">
          <span class="full-tab-name" data-t="config"></span
          ><span class="short-tab-name" data-t="shortConfig"></span>
        </button>
        <button data-tab="logs" data-t="logs"></button>
      </nav>
      <div class="top-actions">
        <button id="live" class="live-control">
          <span class="status-dot"></span><span id="live-label"></span
          ><svg class="icon"><use id="live-icon" href="#icon-pause" /></svg>
        </button>
        <button id="language" class="quiet">
          <svg class="icon"><use href="#icon-globe" /></svg><span id="language-label"></span>
        </button>
      </div>
    </header>
    <aside id="sidebar">
      <div class="rail-heading">
        <h1 class="brand">
          <svg class="icon"><use href="#icon-activity" /></svg>AlohaMini
        </h1>
        <button class="icon-button" id="close-sidebar" aria-controls="sidebar" data-label="hideRuns">
          <svg class="icon"><use href="#icon-panel" /></svg>
        </button>
      </div>
      <div class="sidebar-body">
        <div class="run-header">
          <h2 data-t="runs"></h2>
          <span id="run-count" class="count">0</span>
        </div>
        <label class="search">
          <svg class="icon"><use href="#icon-search" /></svg>
          <input type="search" id="search" data-ph="searchRuns" data-label="searchRuns" />
        </label>
        <p id="run-help" class="sr-only" data-t="compareHint"></p>
        <div id="run-list" aria-describedby="run-help"></div>
        <section id="display-settings" hidden>
          <h2 data-t="display"></h2>
          <button type="button" class="secondary metric-picker" id="metrics-btn" aria-haspopup="dialog">
            <svg class="icon"><use href="#icon-grid" /></svg><span data-t="chooseMetrics"></span>
          </button>
          <label class="setting-row"
            ><span data-t="axis"></span
            ><select id="axis"></select
          ></label>
          <label class="setting-row"
            ><span data-t="trend"></span
            ><select id="trend"></select
          ></label>
          <label class="width-control">
            <span data-t="chartWidth"></span><output for="chart-width" id="width-value"></output>
            <input
              id="chart-width"
              data-label="chartWidth"
              type="range"
              min="240"
              max="1200"
              step="20"
              value="640"
            />
          </label>
          <div id="interval-tools" hidden></div>
        </section>
      </div>
    </aside>
    <div id="shade" hidden></div>
    <main>
      <div class="content">
        <div id="feedback" role="status" hidden></div>
        <section id="empty" class="empty-state" hidden>
          <span class="empty-mark"
            ><svg class="icon"><use href="#icon-chart" /></svg
          ></span>
          <h2 data-t="noRuns"></h2>
          <p data-t="noRunsHint"></p>
          <code>alohamini train monitor --runs-dir /path/to/runs</code>
        </section>
        <div id="run-view" hidden>
          <dl class="readouts" id="kpis"></dl>
          <section id="metrics-view">
            <div id="chart-pages" class="controls" hidden>
              <button class="quiet" id="charts-prev" data-label="previousPage">‹</button
              ><span id="chart-page-status" class="detail" aria-live="polite"></span
              ><button class="quiet" id="charts-next" data-label="nextPage">›</button>
            </div>
            <div id="charts"></div>
          </section>
          <section id="diagnostics-view" hidden>
            <div class="toolbar diag-toolbar">
              <h2 data-t="windowComparison"></h2>
              <div class="controls">
                <label class="axis"
                  ><span data-t="trainMetric"></span
                  ><select id="stat-metric"></select
                ></label>
                <label class="axis"
                  ><span data-t="window"></span
                  ><select id="stat-window"></select
                ></label>
              </div>
            </div>
            <div id="stat-results">
              <div id="stat-trends" class="diag-panel"></div>
              <div class="diag-middle">
                <section class="diag-panel" id="stat-loss-panel">
                  <h3 data-t="componentChanges"></h3>
                  <div id="stat-components"></div>
                </section>
                <section class="diag-panel" id="stat-validation-panel">
                  <div class="diag-section-heading">
                    <h3 data-t="valLoss"></h3>
                    <label class="axis"
                      ><span data-t="targetMax"></span
                      ><input type="number" step="any" class="input" id="stat-target" data-ph="optional"
                    /></label>
                  </div>
                  <div id="stat-validation"></div>
                </section>
              </div>
              <div id="stat-details"></div>
            </div>
          </section>
          <section id="evaluation-view" hidden>
            <div class="toolbar">
              <h2 data-t="evaluationData"></h2>
              <button class="secondary" id="import" data-label="addEval">
                <svg class="icon"><use href="#icon-import" /></svg><span data-t="addEval"></span>
              </button>
            </div>
            <div id="evaluation-results"></div>
          </section>
          <section id="config-view" hidden>
            <div class="toolbar">
              <h2 data-t="savedConfig"></h2>
              <div class="controls">
                <span id="config-import"></span
                ><input
                  id="config-filter"
                  class="input"
                  type="search"
                  data-ph="filterConfig"
                  data-label="filterConfig"
                />
              </div>
            </div>
            <div class="table-wrap"><table id="config-table"></table></div>
          </section>
          <section id="logs-view" hidden>
            <div class="toolbar">
              <h2 data-t="logStream"></h2>
              <select id="log-source" data-label="logSource"></select>
            </div>
            <pre tabindex="0" id="log-output"></pre>
          </section>
        </div>
      </div>
    </main>
    <dialog id="dialog">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button class="icon-button" id="close-dialog" data-label="close">
          <svg class="icon"><use href="#icon-close" /></svg>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div role="tooltip" id="help" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
